<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f2ff;
            color: #2d1959;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            max-width: 520px;
            box-shadow: 0 12px 24px rgba(63, 23, 139, 0.15);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .sucesso {
            background: #e6f4ea;
            color: #0b7a2d;
        }
        .erro {
            background: #fdecea;
            color: #bf2600;
        }
        .highlight {
            font-weight: bold;
            color: #3f178b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge {{ status }}">{{ titulo }}</div>
        <h1>{{ titulo }}</h1>
        <p>{{ mensagem }}</p>
        {% if doadora_nome %}
            <p>Contato da doadora: <span class="highlight">{{ doadora_nome }}</span></p>
        {% endif %}
        {% if campanha_titulo %}
            <p>Campanha: <span class="highlight">{{ campanha_titulo }}</span></p>
        {% endif %}
    </div>
</body>
</html>
